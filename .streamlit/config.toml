[theme]
base = "light"
primaryColor = "#d96b42"
backgroundColor = "#f9f8f6"
secondaryBackgroundColor = "#ffffff"
textColor = "#2c2825"

[server]
maxUploadSize = 25

[client]
# Teachers should not see the page menu (it would reveal /bmsce) or the
# developer toolbar ("Deploy" button, settings).
showSidebarNavigation = false
toolbarMode = "viewer"
